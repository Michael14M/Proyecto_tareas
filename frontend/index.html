<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Vanilla JS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 10px; margin-bottom: 20px;">
            <div>
                <h1>Panel de Tareas (Vanilla JS)</h1>
                <p>conectado como: <strong id="currentUser" style="color: #2563eb;"></strong></p>
            </div>
            <button id="logoutBtn" style="width: auto; background-color: #ef4444; padding: 8px 15px; font-size: 0.85rem; color:white; border: none; border-radius: 4px; cursor: pointer;">Cerrar Sesion</button>
        </header>

        <form id="taskForm">
            <input type="text" id="taskTitle" placeholder="¿Que necesitas hacer?" required>
            <textarea id="taskDescription" placeholder="Descripcion (opcional)..." rows="2"></textarea>
            <button type="submit">Agregar Tarea</button>
        </form>

        <main>
            <h2>Tus Tareas</h2>
            <div id="taskContainer"></div>
        </main>
    </div>

    
</body>
</html>
